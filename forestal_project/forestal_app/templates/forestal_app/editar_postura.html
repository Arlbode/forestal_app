{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Editar Postura{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h2 class="mb-0">
                <i class="bi bi-pencil"></i> Editar Postura #{{ postura.id }}
            </h2>
        </div>

        <div class="card-body">
            <form method="post" id="posturaForm">
                {% csrf_token %}
                {{ form|crispy }}

                <div class="d-flex justify-content-between">
                    <a href="{% url 'listar_posturas' %}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Función para obtener la geolocalización del usuario
    function obtenerGeolocalizacion() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    var latitud = position.coords.latitude;
                    var longitud = position.coords.longitude;
                    var precision = position.coords.accuracy;
    
                    // Asignar valores al formulario
                    document.getElementById('id_latitud').value = latitud.toFixed(6);
                    document.getElementById('id_longitud').value = longitud.toFixed(6);
    
                    // Mostrar precisión en consola
                    console.log("Precisión estimada: " + precision + " metros");
    
                    // Mostrar en pantalla (opcional)
                    const mensaje = "Ubicación detectada con precisión de aproximadamente " + precision.toFixed(1) + " metros.";
                    const contenedor = document.getElementById("mensaje-precision");
                    if (contenedor) contenedor.innerText = mensaje;
                },
                function(error) {
                    console.error("Error al obtener la ubicación: " + error.message);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,      // tiempo máximo para obtener ubicación
                    maximumAge: 0        // no usar ubicación en caché
                }
            );
        } else {
            alert("La geolocalización no está soportada en este navegador.");
        }
    }

    // Llamar a la función para obtener la geolocalización cuando se cargue la página
    window.onload = obtenerGeolocalizacion;
</script>

{% endblock %}
