{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Editar Postura{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h2 class="mb-0">
                <i class="bi bi-pencil"></i> Editar Postura #{{ postura.id }}
            </h2>
        </div>

        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}

                <div class="d-flex justify-content-between">
                    <a href="{% url 'listar_posturas' %}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
