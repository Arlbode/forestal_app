{% extends 'base.html' %}

{% block content %}
    <div class="max-w-md mx-auto mt-8 p-6 bg-white rounded-lg shadow-md border border-gray-200">
        <h2 class="text-xl font-bold mb-4">Confirmar Eliminación</h2>
        <p>¿Estás seguro de que deseas eliminar la reseña "{{ review.title }}"?</p>

        <!-- Formulario de Confirmación -->
        <form method="post" class="mt-4">
            {% csrf_token %}
            <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                Eliminar
            </button>
            <a href="{% url 'dashboard' %}" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition duration-300">Cancelar</a>
        </form>
    </div>
{% endblock %}
